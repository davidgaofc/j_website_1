<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>National Girlfriend Day</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8) 0 8%, transparent 9%),
        radial-gradient(circle at 80% 15%, rgba(244, 114, 182, 0.16) 0 10%, transparent 11%),
        linear-gradient(135deg, #fdf4ff 0%, #f5e7ff 40%, #efe7ff 100%);
      color: #5b2a86;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.35;
      pointer-events: none;
    }

    body::before {
      width: 220px;
      height: 220px;
      background: rgba(216, 180, 254, 0.25);
      top: -70px;
      right: -40px;
    }

    body::after {
      width: 180px;
      height: 180px;
      background: rgba(244, 114, 182, 0.16);
      bottom: -50px;
      left: -30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      color: #5b2a86;
      border: 1px solid #ebdfff;
      border-radius: 26px;
      box-shadow: 0 18px 42px rgba(139, 92, 246, 0.18), inset 0 1px 0 rgba(255,255,255,0.8);
      padding: 32px;
      max-width: 640px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "✿ ✿ ✿";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #d8b4fe;
      font-size: 1.1rem;
      letter-spacing: 0.35em;
      opacity: 0.9;
    }

    .bouquet {
      font-size: 2.8rem;
      margin-bottom: 8px;
      letter-spacing: 0.2em;
      filter: drop-shadow(0 4px 8px rgba(139, 92, 246, 0.18));
    }

    h1 {
      margin-top: 0;
      color: #8b5cf6;
      font-size: 2rem;
      text-shadow: 0 1px 0 #f8f5ff;
      letter-spacing: 0.02em;
    }

    p {
      line-height: 1.75;
      font-size: 1.05rem;
      margin: 0 0 14px;
    }

    .spotify-wrap {
      margin: 24px 0 12px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(167, 139, 250, 0.22);
      border: 1px solid #f5e7ff;
      background: #faf5ff;
    }

    a {
      color: #8b5cf6;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bouquet" aria-label="bouquet of flowers">💐🌸🌷</div>
    <h1>Happy National Girlfriend Day</h1>
    <p>Missing you, and here's a song that made me think of us.</p>
    <p>I hope you feel my love even though we're apart.</p>
    <div class="spotify-wrap">
      <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0FxTehUyzBC0cVGt3Fd0NJ?utm_source=generator&si=346a38147ca44551" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
    <p><a href="index.html">Back to home</a></p>
  </div>
</body>
</html>
